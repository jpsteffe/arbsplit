name: terraform plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/1008138599778/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "app-deployer@jpsteffe.iam.gserviceaccount.com"
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform format
        run: terraform fmt -check -recursive infra
      - name: Terraform init
        run: terraform -chdir=infra init -input=false -lockfile=readonly
      - name: Terraform validate
        run: terraform -chdir=infra validate
      - name: Terraform plan
        run: terraform -chdir=infra plan -input=false -lock-timeout=300s
