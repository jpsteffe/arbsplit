name: apply

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Run when the push has no usable base, such as a new branch.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(infra/|\.github/workflows/apply\.yaml$)'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

  apply:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/1008138599778/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "app-deployer@jpsteffe.iam.gserviceaccount.com"
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform init
        run: terraform -chdir=infra init -input=false -lockfile=readonly
      - name: Terraform apply
        run: terraform -chdir=infra apply -auto-approve -input=false -lock-timeout=300s
